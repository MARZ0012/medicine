<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>おくすりチェック</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    height: 100%;
    font-family: -apple-system, "Hiragino Sans", "ヒラギノ角ゴシック", "Yu Gothic", sans-serif;
    background: #1a1d23;
    color: #e8e4dc;
    overscroll-behavior: none;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 20px 40px;
    min-height: 100vh;
  }

  .date {
    font-size: 15px;
    color: #8a8578;
    margin-bottom: 4px;
    letter-spacing: 0.05em;
  }

  h1 {
    font-size: 22px;
    font-weight: 500;
    margin-bottom: 28px;
    letter-spacing: 0.08em;
    color: #e8e4dc;
  }

  .cards {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .card {
    background: #262a32;
    border-radius: 18px;
    padding: 20px 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    user-select: none;
    transition: transform 0.15s ease, background 0.2s ease, border-color 0.2s ease;
    border: 2px solid #2f343d;
  }

  .card:active {
    transform: scale(0.98);
  }

  .card.done {
    background: #2d3a2a;
    border-color: #4a6b3d;
  }

  .label {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .meal {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: #e8e4dc;
  }

  .sub {
    font-size: 13px;
    color: #8a8578;
  }

  .card.done .meal {
    color: #c8e0b8;
  }

  .card.done .sub {
    color: #9ab588;
  }

  .time-stamp {
    font-size: 14px;
    color: #c8e0b8;
    font-feature-settings: "tnum";
    font-weight: 500;
  }

  .next-hint {
    font-size: 13px;
    color: #d8a85a;
    font-weight: 500;
  }

  /* まだ前の薬から時間が経ってないカード */
  .card.too-soon {
    border-color: #5a4d2e;
  }
  .card.too-soon .mark {
    border-color: #5a4d2e;
  }

  .mark {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: 2px dashed #4a5160;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    color: transparent;
    transition: all 0.25s ease;
    flex-shrink: 0;
  }

  .card.done .mark {
    background: #6b9650;
    border: 2px solid #6b9650;
    color: #fff;
    transform: scale(1.05);
  }

  .section-title {
    width: 100%;
    max-width: 420px;
    margin-top: 36px;
    margin-bottom: 12px;
    font-size: 14px;
    color: #8a8578;
    letter-spacing: 0.1em;
  }

  .history {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .history-item {
    background: #21242b;
    border-radius: 14px;
    padding: 14px 18px;
    border: 1px solid #2a2e37;
  }

  .history-date {
    font-size: 13px;
    color: #a8a294;
    margin-bottom: 10px;
    font-weight: 500;
  }

  .history-meals {
    display: flex;
    gap: 8px;
  }

  .history-meal {
    flex: 1;
    background: #1a1d23;
    border-radius: 8px;
    padding: 8px 10px;
    border: 1px solid #2a2e37;
  }

  .history-meal.taken {
    border-color: #3d5230;
    background: #232b20;
  }

  .history-meal-label {
    font-size: 11px;
    color: #8a8578;
    margin-bottom: 2px;
  }

  .history-meal-time {
    font-size: 13px;
    color: #c8e0b8;
    font-weight: 600;
    font-feature-settings: "tnum";
  }

  .history-meal-time.skipped {
    color: #4a4a4a;
  }

  .footer {
    margin-top: 32px;
    font-size: 12px;
    color: #6b6558;
    text-align: center;
    line-height: 1.7;
  }

  .reset {
    margin-top: 10px;
    font-size: 12px;
    color: #6b6558;
    background: none;
    border: none;
    padding: 6px 12px;
    cursor: pointer;
    text-decoration: underline;
  }

  .empty {
    text-align: center;
    color: #6b6558;
    font-size: 13px;
    padding: 20px;
  }

  .start-info {
    width: 100%;
    max-width: 420px;
    margin-top: 36px;
    background: #21242b;
    border: 1px solid #2a2e37;
    border-radius: 14px;
    padding: 18px 20px;
    text-align: center;
  }

  .start-info .big {
    font-size: 28px;
    font-weight: 600;
    color: #c8e0b8;
    font-feature-settings: "tnum";
    letter-spacing: 0.04em;
  }

  .start-info .small {
    font-size: 12px;
    color: #8a8578;
    margin-top: 4px;
  }

  .hint {
    width: 100%;
    max-width: 420px;
    font-size: 11px;
    color: #6b6558;
    text-align: right;
    margin-top: 6px;
    margin-bottom: -6px;
  }

  /* 時間変更モーダル */
  .modal-bg {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }

  .modal-bg.show { display: flex; }

  .modal {
    background: #262a32;
    border-radius: 18px;
    padding: 24px;
    width: 100%;
    max-width: 320px;
    border: 2px solid #2f343d;
  }

  .modal-title {
    font-size: 17px;
    font-weight: 600;
    color: #e8e4dc;
    margin-bottom: 4px;
  }

  .modal-sub {
    font-size: 12px;
    color: #8a8578;
    margin-bottom: 18px;
  }

  .modal input[type="time"] {
    width: 100%;
    font-size: 26px;
    padding: 12px;
    background: #1a1d23;
    border: 2px solid #3a4150;
    border-radius: 12px;
    color: #e8e4dc;
    text-align: center;
    font-feature-settings: "tnum";
    margin-bottom: 18px;
  }

  .modal-btns {
    display: flex;
    gap: 10px;
  }

  .modal-btns button {
    flex: 1;
    padding: 13px;
    border-radius: 12px;
    border: none;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }

  .btn-cancel {
    background: #3a3f49;
    color: #c8c4ba;
  }

  .btn-ok {
    background: #6b9650;
    color: #fff;
  }
</style>
</head>
<body>
  <div class="date" id="date"></div>
  <h1>おくすり、のんだ?</h1>

  <div class="hint">タップで記録 / 長押しで時間を変更</div>
  <div class="cards">
    <div class="card" data-time="asa">
      <div class="label">
        <div class="meal">朝</div>
        <div class="sub" id="sub-asa">朝ごはんの前</div>
      </div>
      <div class="mark">○</div>
    </div>

    <div class="card" data-time="hiru">
      <div class="label">
        <div class="meal">昼</div>
        <div class="sub" id="sub-hiru">昼ごはんの前</div>
      </div>
      <div class="mark">○</div>
    </div>

    <div class="card" data-time="yoru">
      <div class="label">
        <div class="meal">夜</div>
        <div class="sub" id="sub-yoru">夜ごはんの前</div>
      </div>
      <div class="mark">○</div>
    </div>
  </div>

  <div class="start-info" id="startInfo" style="display:none;">
    <div class="big" id="startDays"></div>
    <div class="small" id="startSince"></div>
  </div>

  <div class="section-title">この1週間の記録</div>
  <div class="history" id="history"></div>

  <div class="footer">
    タップで ○ / もう一度タップで取り消し<br>
    長押しで時間を変更
  </div>
  <button class="reset" id="resetBtn">今日の記録をリセット</button>

  <!-- 時間変更モーダル -->
  <div class="modal-bg" id="modalBg">
    <div class="modal">
      <div class="modal-title" id="modalTitle">時間を変更</div>
      <div class="modal-sub">飲んだ時間を入力してください</div>
      <input type="time" id="modalTime">
      <div class="modal-btns">
        <button class="btn-cancel" id="modalCancel">キャンセル</button>
        <button class="btn-ok" id="modalOk">決定</button>
      </div>
    </div>
  </div>

<script>
  function todayKey() {
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `med-${y}-${m}-${day}`;
  }

  function formatDate(dateStr) {
    const m = dateStr.match(/^med-(\d+)-(\d+)-(\d+)$/);
    if (!m) return dateStr;
    const d = new Date(+m[1], +m[2]-1, +m[3]);
    const days = ['日','月','火','水','木','金','土'];
    return `${+m[2]}月${+m[3]}日 (${days[d.getDay()]})`;
  }

  function formatTime(isoStr) {
    if (!isoStr) return '';
    const d = new Date(isoStr);
    const h = String(d.getHours()).padStart(2,'0');
    const m = String(d.getMinutes()).padStart(2,'0');
    return `${h}:${m}`;
  }

  function showDate() {
    const d = new Date();
    const days = ['日','月','火','水','木','金','土'];
    document.getElementById('date').textContent =
      `${d.getFullYear()}年 ${d.getMonth()+1}月 ${d.getDate()}日 (${days[d.getDay()]})`;
  }

  // 保存先:localStorageを優先(普通のブラウザ用)
  const storage = {
    async get(key) {
      try {
        const v = localStorage.getItem(key);
        return v ? { value: v } : null;
      } catch(e) {
        if (window.storage) return await window.storage.get(key);
        return null;
      }
    },
    async set(key, value) {
      try {
        localStorage.setItem(key, value);
      } catch(e) {
        if (window.storage) return await window.storage.set(key, value);
      }
    },
    async list(prefix) {
      try {
        const keys = [];
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k.startsWith(prefix)) keys.push(k);
        }
        return { keys };
      } catch(e) {
        if (window.storage) return await window.storage.list(prefix);
        return { keys: [] };
      }
    }
  };

  const state = { asa: null, hiru: null, yoru: null };

  // 服用間隔の目安(時間)。次に飲める目安の計算に使う(厳密管理ではない)
  const INTERVAL_HOURS = 4;

  // 今日のうち一番最後に飲んだ時刻を返す(なければ null)
  function lastTakenDate() {
    const times = ['asa','hiru','yoru']
      .map(t => state[t])
      .filter(Boolean)
      .map(iso => new Date(iso));
    if (times.length === 0) return null;
    return new Date(Math.max(...times.map(d => d.getTime())));
  }

  // 次に飲める目安まで「あと何分」か。0以下なら今飲んでOK
  function minutesUntilNext() {
    const last = lastTakenDate();
    if (!last) return 0;
    const next = last.getTime() + INTERVAL_HOURS * 3600000;
    return Math.round((next - Date.now()) / 60000);
  }

  async function loadState() {
    try {
      const result = await storage.get(todayKey());
      if (result && result.value) {
        const saved = JSON.parse(result.value);
        Object.assign(state, saved);
      }
    } catch(e) {}
    render();
  }

  async function saveState() {
    try {
      await storage.set(todayKey(), JSON.stringify(state));
    } catch(e) {
      console.error('保存できませんでした', e);
    }
  }

  function render() {
    const subLabels = {
      asa: '朝ごはんの前',
      hiru: '昼ごはんの前',
      yoru: '夜ごはんの前'
    };
    const mins = minutesUntilNext();
    document.querySelectorAll('.card').forEach(card => {
      const t = card.dataset.time;
      const sub = document.getElementById('sub-' + t);
      if (state[t]) {
        card.classList.add('done');
        card.classList.remove('too-soon');
        sub.innerHTML = `<span class="time-stamp">${formatTime(state[t])} に服用</span>`;
      } else {
        card.classList.remove('done');
        if (mins > 0) {
          // まだ前の薬から時間が経っていない
          card.classList.add('too-soon');
          const h = Math.floor(mins / 60);
          const m = mins % 60;
          const ago = h > 0 ? `あと約${h}時間${m > 0 ? m + '分' : ''}` : `あと約${m}分`;
          sub.innerHTML = `<span class="next-hint">${ago}で目安</span>`;
        } else {
          card.classList.remove('too-soon');
          sub.textContent = subLabels[t];
        }
      }
    });
  }

  async function loadHistory() {
    const historyEl = document.getElementById('history');
    historyEl.innerHTML = '';

    try {
      const list = await storage.list('med-');
      if (!list || !list.keys || list.keys.length === 0) {
        historyEl.innerHTML = '<div class="empty">まだ記録がありません</div>';
        return;
      }

      const today = todayKey();
      const allKeys = list.keys
        .filter(k => /^med-\d+-\d+-\d+$/.test(k))
        .sort();

      // 記録開始日からの日数を表示
      if (allKeys.length > 0) {
        const first = allKeys[0].match(/^med-(\d+)-(\d+)-(\d+)$/);
        if (first) {
          const startDate = new Date(+first[1], +first[2]-1, +first[3]);
          const now = new Date();
          now.setHours(0,0,0,0);
          startDate.setHours(0,0,0,0);
          const days = Math.floor((now - startDate) / 86400000) + 1;
          document.getElementById('startDays').textContent = `${days}日目`;
          document.getElementById('startSince').textContent =
            `${+first[2]}月${+first[3]}日から記録中`;
          document.getElementById('startInfo').style.display = 'block';
        }
      }

      // 過去7日分(今日を除く)だけ表示
      const keys = allKeys
        .filter(k => k !== today)
        .reverse()
        .slice(0, 7);

      if (keys.length === 0) {
        historyEl.innerHTML = '<div class="empty">過去の記録はまだありません</div>';
        return;
      }

      for (const key of keys) {
        try {
          const result = await storage.get(key);
          if (!result || !result.value) continue;
          const data = JSON.parse(result.value);

          const item = document.createElement('div');
          item.className = 'history-item';

          const meals = [
            { key: 'asa', label: '朝' },
            { key: 'hiru', label: '昼' },
            { key: 'yoru', label: '夜' }
          ];

          const mealsHtml = meals.map(m => {
            const taken = !!data[m.key];
            const timeText = taken ? formatTime(data[m.key]) : '—';
            return `
              <div class="history-meal ${taken ? 'taken' : ''}">
                <div class="history-meal-label">${m.label}</div>
                <div class="history-meal-time ${taken ? '' : 'skipped'}">${timeText}</div>
              </div>
            `;
          }).join('');

          item.innerHTML = `
            <div class="history-date">${formatDate(key)}</div>
            <div class="history-meals">${mealsHtml}</div>
          `;
          historyEl.appendChild(item);
        } catch(e) {}
      }
    } catch(e) {
      historyEl.innerHTML = '<div class="empty">履歴を読み込めませんでした</div>';
    }
  }

  // ===== タップ + 長押し =====
  const LONG_PRESS_MS = 500;
  let pressTimer = null;
  let longPressed = false;
  let editingTime = null; // 編集中の時間帯キー

  const mealNames = { asa: '朝', hiru: '昼', yoru: '夜' };

  function openTimeModal(t) {
    editingTime = t;
    // 既存記録があればその時刻、なければ現在時刻を初期値に
    const base = state[t] ? new Date(state[t]) : new Date();
    const hh = String(base.getHours()).padStart(2,'0');
    const mm = String(base.getMinutes()).padStart(2,'0');
    document.getElementById('modalTime').value = `${hh}:${mm}`;
    document.getElementById('modalTitle').textContent = `${mealNames[t]} の時間を変更`;
    document.getElementById('modalBg').classList.add('show');
  }

  function closeTimeModal() {
    editingTime = null;
    document.getElementById('modalBg').classList.remove('show');
  }

  document.getElementById('modalCancel').addEventListener('click', closeTimeModal);
  document.getElementById('modalBg').addEventListener('click', (e) => {
    if (e.target.id === 'modalBg') closeTimeModal();
  });

  document.getElementById('modalOk').addEventListener('click', async () => {
    if (!editingTime) return;
    const val = document.getElementById('modalTime').value;
    if (val) {
      const [h, m] = val.split(':').map(Number);
      const d = new Date();
      d.setHours(h, m, 0, 0);
      state[editingTime] = d.toISOString();
      render();
      await saveState();
    }
    closeTimeModal();
  });

  async function toggleCard(t) {
    if (state[t]) {
      state[t] = null;
    } else {
      // まだ前の薬から時間が経っていなければ確認
      const mins = minutesUntilNext();
      if (mins > 0) {
        const h = Math.floor(mins / 60);
        const m = mins % 60;
        const remain = h > 0 ? `約${h}時間${m > 0 ? m + '分' : ''}` : `約${m}分`;
        if (!confirm(`まだ前の薬から時間が経っていません(目安まで${remain})。飲みますか?`)) {
          return;
        }
      }
      state[t] = new Date().toISOString();
    }
    render();
    await saveState();
  }

  document.querySelectorAll('.card').forEach(card => {
    const t = card.dataset.time;

    const startPress = () => {
      longPressed = false;
      pressTimer = setTimeout(() => {
        longPressed = true;
        openTimeModal(t);
      }, LONG_PRESS_MS);
    };
    const cancelPress = () => {
      if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
    };

    // ポインターイベントでタッチ/マウス両対応
    card.addEventListener('pointerdown', startPress);
    card.addEventListener('pointerup', async () => {
      cancelPress();
      if (!longPressed) await toggleCard(t);
    });
    card.addEventListener('pointerleave', cancelPress);
    card.addEventListener('pointercancel', cancelPress);
    // 長押し中のテキスト選択・コンテキストメニュー抑制
    card.addEventListener('contextmenu', (e) => e.preventDefault());
  });

  document.getElementById('resetBtn').addEventListener('click', async () => {
    if (confirm('今日の記録を消しますか?')) {
      state.asa = null;
      state.hiru = null;
      state.yoru = null;
      render();
      await saveState();
    }
  });

  setInterval(() => {
    const newDate = new Date();
    const currentDisplay = document.getElementById('date').textContent;
    const days = ['日','月','火','水','木','金','土'];
    const expected = `${newDate.getFullYear()}年 ${newDate.getMonth()+1}月 ${newDate.getDate()}日 (${days[newDate.getDay()]})`;
    if (currentDisplay !== expected) {
      location.reload();
    } else {
      render(); // 「あと約◯時間」の表示を更新
    }
  }, 60000);

  showDate();
  loadState();
  loadHistory();
</script>
</body>
</html>
