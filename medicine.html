<script>
  // インライン Web App Manifest（単一HTMLのままホーム画面に追加できるようにする）
  (function(){
    const manifest={
      name:"おくすりチェック", short_name:"おくすり",
      start_url:".", display:"standalone",
      background_color:"#1b1a23", theme_color:"#1b1a23",
      icons:[
        {src:"apple-touch-icon-512.png", sizes:"512x512", type:"image/png"},
        {src:"apple-touch-icon.png", sizes:"180x180", type:"image/png"}
      ]
    };
    try{
      const blob=new Blob([JSON.stringify(manifest)],{type:"application/manifest+json"});
      const link=document.createElement("link");
      link.rel="manifest"; link.href=URL.createObjectURL(blob);
      document.head.appendChild(link);
    }catch(e){}
  })();
</script>

<!-- Firebase SDK（Progress Deck と同じ 9.23.0 compat 版） -->
<script src="https://cdn.jsdelivr.net/npm/firebase@9.23.0/firebase-app-compat.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@9.23.0/firebase-database-compat.min.js"></script>

<script>
  // Progress Deck と同じプロジェクトの config をそのまま流用（apiKey は公開前提で問題なし）
  const firebaseConfig = {
    apiKey: "AIzaSyD9h01ojm1udmPDa1P-5UzSfcs0_Q6cbg0",
    authDomain: "progress-deck.firebaseapp.com",
    databaseURL: "https://progress-deck-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "progress-deck",
    storageBucket: "progress-deck.firebasestorage.app",
    messagingSenderId: "22418933605",
    appId: "1:22418933605:web:c1d4985c452572685e438c"
  };
  firebase.initializeApp(firebaseConfig);
  const _fbDb = firebase.database();
  // 薬アプリは progressDeck とは別ノード medicineApp を使う（データが混ざらないように）
  const _fbRef = _fbDb.ref('medicineApp');
  const _fbAuth = firebase.auth();

  window._fbReady = false;
  window._firebaseData = null;
  window._fbAuthError = null;

  // 全データ（med-YYYY-MM-DD を全部）をまとめてクラウドへ上書き保存
  window.firebaseSave = function(allData) {
    return _fbRef.set(allData).catch(e => console.error("Firebase save error:", e));
  };

  // ログイン成功後に1回だけ読み込む
  function _loadFromFirebase() {
    _fbRef.once('value', (snapshot) => {
      window._fbReady = true;
      const val = snapshot.val();
      window._firebaseData = (val && typeof val === 'object') ? val : null;
      if (window._onFirebaseReady) window._onFirebaseReady(window._firebaseData);
    }, (err) => {
      console.error("Firebase read error:", err);
      window._fbAuthError = "DBアクセスが拒否されました（ルール設定を確認してください）";
      window._fbReady = true;
      if (window._onFirebaseReady) window._onFirebaseReady(null);
    });
  }

  // まず匿名ログイン。成功したらデータ読み込みへ。
  _fbAuth.signInAnonymously().catch((e) => {
    console.error("匿名ログイン失敗:", e);
    window._fbAuthError = "匿名ログインに失敗しました（Authentication設定を確認）";
    if (window._onFirebaseReady) window._onFirebaseReady(null);
  });
  _fbAuth.onAuthStateChanged((user) => {
    if (user) _loadFromFirebase();
  });
</script>

<body>
  <div class="date" id="date"></div>
  <h1>おくすり、のんだ?</h1>

  <div class="hint">タップで記録 / 長押しで時間を変更</div>
  <div class="cards">
    <div class="card" data-time="asa">
      <div class="label">
        <div class="meal">朝</div>
        <div class="sub" id="sub-asa">朝ごはんの前</div>
      </div>
      <div class="mark">○</div>
    </div>

    <div class="card" data-time="hiru">
      <div class="label">
        <div class="meal">昼</div>
        <div class="sub" id="sub-hiru">昼ごはんの前</div>
      </div>
      <div class="mark">○</div>
    </div>

    <div class="card" data-time="yoru">
      <div class="label">
        <div class="meal">夜</div>
        <div class="sub" id="sub-yoru">夜ごはんの前</div>
      </div>
      <div class="mark">○</div>
    </div>
  </div>

  <div class="start-info" id="startInfo" style="display:none;">
    <div class="big" id="startDays"></div>
    <div class="small" id="startSince"></div>
  </div>

  <div class="section-title">この1週間の記録</div>
  <div class="history" id="history"></div>

  <div class="footer">
    タップで記録 / もう一度タップで取り消し<br>
    長押しで時間を変更できます
  </div>
  <button class="reset" id="resetBtn">今日の記録をリセット</button>

  <!-- 時間変更モーダル -->
  <div class="modal-bg" id="modalBg">
    <div class="modal">
      <div class="modal-title" id="modalTitle">時間を変更</div>
      <div class="modal-sub">飲んだ時間を入力してください</div>
      <input type="time" id="modalTime">
      <div class="modal-btns">
        <button class="btn-cancel" id="modalCancel">キャンセル</button>
        <button class="btn-ok" id="modalOk">決定</button>
      </div>
    </div>
  </div>

<script>
  function todayKey() {
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `med-${y}-${m}-${day}`;
  }

  function formatDate(dateStr) {
    const m = dateStr.match(/^med-(\d+)-(\d+)-(\d+)$/);
    if (!m) return dateStr;
    const d = new Date(+m[1], +m[2]-1, +m[3]);
    const days = ['日','月','火','水','木','金','土'];
    return `${+m[2]}月${+m[3]}日 (${days[d.getDay()]})`;
  }

  function formatTime(isoStr) {
    if (!isoStr) return '';
    const d = new Date(isoStr);
    const h = String(d.getHours()).padStart(2,'0');
    const m = String(d.getMinutes()).padStart(2,'0');
    return `${h}:${m}`;
  }

  function showDate() {
    const d = new Date();
    const days = ['日','月','火','水','木','金','土'];
    document.getElementById('date').textContent =
      `${d.getFullYear()}年 ${d.getMonth()+1}月 ${d.getDate()}日 (${days[d.getDay()]})`;
  }

  // ===== データ層 =====
  // 全日分を1つのオブジェクトで保持: { "med-YYYY-MM-DD": {asa,hiru,yoru}, ... }
  // これを Firebase の medicineApp ノードへ丸ごと保存し、localStorage にも控えを残す。
  let allDays = {};

  const LS_PREFIX = 'med-';            // 旧localStorage形式（1日1キー）と互換
  const LS_BLOB = 'medicineApp.all';   // まとめて控える用

  // localStorage から全日分を読む（旧形式の個別キーも拾って移行する）
  function readLocalAll() {
    const out = {};
    try {
      // まずまとめ控えを読む
      const blob = localStorage.getItem(LS_BLOB);
      if (blob) {
        const parsed = JSON.parse(blob);
        if (parsed && typeof parsed === 'object') Object.assign(out, parsed);
      }
      // 旧形式の個別キー(med-YYYY-MM-DD)も拾う
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && /^med-\d+-\d+-\d+$/.test(k)) {
          try {
            const v = JSON.parse(localStorage.getItem(k));
            if (v && typeof v === 'object' && !out[k]) out[k] = v;
          } catch(e) {}
        }
      }
    } catch(e) {}
    return out;
  }

  // localStorage へ控える（まとめ + 当日個別キー）
  function writeLocalAll() {
    try {
      localStorage.setItem(LS_BLOB, JSON.stringify(allDays));
      const tk = todayKey();
      if (allDays[tk]) localStorage.setItem(tk, JSON.stringify(allDays[tk]));
    } catch(e) {}
  }

  // 2つの allDays をマージ（中身のある日付を優先。両方あれば「服用済みの数が多い方」を採用）
  function mergeDays(a, b) {
    const out = {};
    const keys = new Set([...Object.keys(a||{}), ...Object.keys(b||{})]);
    const score = d => ['asa','hiru','yoru'].filter(k => d && d[k]).length;
    keys.forEach(k => {
      const da = a && a[k], db = b && b[k];
      if (da && db) out[k] = score(db) > score(da) ? db : da;
      else out[k] = da || db;
    });
    return out;
  }

  // 今日の state（allDays への参照。なければ作る）
  function todayState() {
    const tk = todayKey();
    if (!allDays[tk]) allDays[tk] = { asa: null, hiru: null, yoru: null };
    return allDays[tk];
  }

  // state は常に「今日」を指す getter 経由で使う
  const state = new Proxy({}, {
    get(_, prop) { return todayState()[prop]; },
    set(_, prop, value) { todayState()[prop] = value; return true; }
  });

  // 保存：localな控え + クラウドへ全データ上書き
  async function saveState() {
    writeLocalAll();
    try {
      if (window.firebaseSave) await window.firebaseSave(allDays);
    } catch(e) {
      console.error('クラウド保存に失敗（ローカルには保存済み）', e);
    }
  }

  // 起動：まずローカルですぐ描画 → クラウドが来たらマージして再描画＆吸い上げ
  function initData() {
    allDays = readLocalAll();
    render();
    loadHistory();

    // Firebase の読み込み完了コールバック
    window._onFirebaseReady = function(cloud) {
      if (cloud && typeof cloud === 'object') {
        // クラウド形式の検証：med-YYYY-MM-DD のキーだけ採用
        const cleaned = {};
        Object.keys(cloud).forEach(k => {
          if (/^med-\d+-\d+-\d+$/.test(k)) cleaned[k] = cloud[k];
        });
        const merged = mergeDays(allDays, cleaned);
        allDays = merged;
        render();
        loadHistory();
        // ローカルにしかなかった分をクラウドへ吸い上げ（初回移行）
        writeLocalAll();
        if (window.firebaseSave) window.firebaseSave(allDays).catch(()=>{});
      } else if (window._fbReady && Object.keys(allDays).length > 0) {
        // クラウドが空でローカルに記録あり → 移行アップロード
        if (window.firebaseSave) window.firebaseSave(allDays).catch(()=>{});
      }
    };
    // もし既にFirebaseが読み込み終わっていたら即実行
    if (window._fbReady) window._onFirebaseReady(window._firebaseData);
  }

  function render() {
    const subLabels = {
      asa: '朝ごはんの前',
      hiru: '昼ごはんの前',
      yoru: '夜ごはんの前'
    };
    document.querySelectorAll('.card').forEach(card => {
      const t = card.dataset.time;
      const sub = document.getElementById('sub-' + t);
      if (state[t]) {
        card.classList.add('done');
        sub.innerHTML = `<span class="time-stamp">${formatTime(state[t])} に服用</span>`;
      } else {
        card.classList.remove('done');
        sub.textContent = subLabels[t];
      }
    });
  }

  function loadHistory() {
    const historyEl = document.getElementById('history');
    historyEl.innerHTML = '';

    try {
      const allKeys = Object.keys(allDays)
        .filter(k => /^med-\d+-\d+-\d+$/.test(k))
        .sort();

      if (allKeys.length === 0) {
        document.getElementById('startInfo').style.display = 'none';
        historyEl.innerHTML = '<div class="empty">まだ記録がありません</div>';
        return;
      }

      const today = todayKey();

      // 記録開始日からの日数を表示
      const first = allKeys[0].match(/^med-(\d+)-(\d+)-(\d+)$/);
      if (first) {
        const startDate = new Date(+first[1], +first[2]-1, +first[3]);
        const now = new Date();
        now.setHours(0,0,0,0);
        startDate.setHours(0,0,0,0);
        const days = Math.floor((now - startDate) / 86400000) + 1;
        document.getElementById('startDays').textContent = `${days}日目`;
        document.getElementById('startSince').textContent =
          `${+first[2]}月${+first[3]}日から記録中`;
        document.getElementById('startInfo').style.display = 'block';
      }

      // 過去7日分(今日を除く)だけ表示
      const keys = allKeys
        .filter(k => k !== today)
        .reverse()
        .slice(0, 7);

      if (keys.length === 0) {
        historyEl.innerHTML = '<div class="empty">過去の記録はまだありません</div>';
        return;
      }

      for (const key of keys) {
        try {
          const data = allDays[key];
          if (!data) continue;

          const item = document.createElement('div');
          item.className = 'history-item';

          const meals = [
            { key: 'asa', label: '朝' },
            { key: 'hiru', label: '昼' },
            { key: 'yoru', label: '夜' }
          ];

          const mealsHtml = meals.map(m => {
            const taken = !!data[m.key];
            const timeText = taken ? formatTime(data[m.key]) : '—';
            return `
              <div class="history-meal ${taken ? 'taken' : ''}">
                <div class="history-meal-label">${m.label}</div>
                <div class="history-meal-time ${taken ? '' : 'skipped'}">${timeText}</div>
              </div>
            `;
          }).join('');

          item.innerHTML = `
            <div class="history-date">${formatDate(key)}</div>
            <div class="history-meals">${mealsHtml}</div>
          `;
          historyEl.appendChild(item);
        } catch(e) {}
      }
    } catch(e) {
      historyEl.innerHTML = '<div class="empty">履歴を読み込めませんでした</div>';
    }
  }

  // ===== タップ + 長押し =====
  const LONG_PRESS_MS = 500;
  let pressTimer = null;
  let longPressed = false;
  let editingTime = null; // 編集中の時間帯キー

  const mealNames = { asa: '朝', hiru: '昼', yoru: '夜' };

  function openTimeModal(t) {
    editingTime = t;
    // 既存記録があればその時刻、なければ現在時刻を初期値に
    const base = state[t] ? new Date(state[t]) : new Date();
    const hh = String(base.getHours()).padStart(2,'0');
    const mm = String(base.getMinutes()).padStart(2,'0');
    document.getElementById('modalTime').value = `${hh}:${mm}`;
    document.getElementById('modalTitle').textContent = `${mealNames[t]} の時間を変更`;
    document.getElementById('modalBg').classList.add('show');
  }

  function closeTimeModal() {
    editingTime = null;
    document.getElementById('modalBg').classList.remove('show');
  }

  document.getElementById('modalCancel').addEventListener('click', closeTimeModal);
  document.getElementById('modalBg').addEventListener('click', (e) => {
    if (e.target.id === 'modalBg') closeTimeModal();
  });

  document.getElementById('modalOk').addEventListener('click', async () => {
    if (!editingTime) return;
    const val = document.getElementById('modalTime').value;
    if (val) {
      const [h, m] = val.split(':').map(Number);
      const d = new Date();
      d.setHours(h, m, 0, 0);
      state[editingTime] = d.toISOString();
      render();
      loadHistory();
      await saveState();
    }
    closeTimeModal();
  });

  async function toggleCard(t) {
    if (state[t]) {
      state[t] = null;
    } else {
      state[t] = new Date().toISOString();
    }
    render();
    loadHistory();
    await saveState();
  }

  document.querySelectorAll('.card').forEach(card => {
    const t = card.dataset.time;

    const startPress = () => {
      longPressed = false;
      pressTimer = setTimeout(() => {
        longPressed = true;
        openTimeModal(t);
      }, LONG_PRESS_MS);
    };
    const cancelPress = () => {
      if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
    };

    // ポインターイベントでタッチ/マウス両対応
    card.addEventListener('pointerdown', startPress);
    card.addEventListener('pointerup', async () => {
      cancelPress();
      if (!longPressed) await toggleCard(t);
    });
    card.addEventListener('pointerleave', cancelPress);
    card.addEventListener('pointercancel', cancelPress);
    // 長押し中のテキスト選択・コンテキストメニュー抑制
    card.addEventListener('contextmenu', (e) => e.preventDefault());
  });

  document.getElementById('resetBtn').addEventListener('click', async () => {
    if (confirm('今日の記録を消しますか?')) {
      state.asa = null;
      state.hiru = null;
      state.yoru = null;
      render();
      loadHistory();
      await saveState();
    }
  });

  // 日付が変わったら（日付表示が変わったら）リロードして今日の枠を作り直す
  setInterval(() => {
    const newDate = new Date();
    const currentDisplay = document.getElementById('date').textContent;
    const days = ['日','月','火','水','木','金','土'];
    const expected = `${newDate.getFullYear()}年 ${newDate.getMonth()+1}月 ${newDate.getDate()}日 (${days[newDate.getDay()]})`;
    if (currentDisplay !== expected) {
      location.reload();
    }
  }, 60000);

  showDate();
  initData();
</script>
</body>
</html>
